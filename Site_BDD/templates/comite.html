<!doctype html>
<html>
<head>
    <title>Comités</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_css.css') }}">
</head>

<body>
    <header>
  <h1 style="text-align:center"> Les archives de Babel </h1>
  <h2 style="text-align:center"> Comités </h2>
</header>

<nav style="text-align:center; background-color:LightGray">
    <a href="{{url_for('accueil')}}">Accueil</a> -
    <a href="{{url_for('auteur')}}">Auteurs</a> -
    <a href="{{url_for('revue')}}">Revues</a> -
    <a href="{{url_for('labo')}}">Laboratoires</a> -
    <a href="{{url_for('recherche')}}">Recherche</a>
</nav>

<p style="text-align: center;">
  Voici la liste des différents comité :
</p>

<table border="1" align="center">

    <thead>
        <tr>
            <th scope="col">Nom Comité</th>
        </tr>
    </thead>
    <tbody>
        {% for comite in lst_comite %}
        <tr class="ligne-cliquable" data-href="{{ url_for('info_comite', idComite=comite.idcomite) }}">
            <th scope="row">{{comite.nom_comite}}</th>
        </tr>

        {% endfor %}
    </tbody>
</table>


<p style="text-align:center">
  <br>
  Vous pouvez cliquer sur un comité pour avoir plus d'information à son sujet.
</p>
  


<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".ligne-cliquable").forEach(row => {
        row.addEventListener("click", () => {
            window.location = row.dataset.href;
        });
    });
});
</script>

</body>

</html>
